//
// Parties domain messages + PartyService.
// Suggested RBAC (not enforced): party:read, party:write.

syntax = "proto3";

package rusterp.party.v1;

// Business role a party may hold. A party may hold several roles.
enum PartyRole {
  PARTY_ROLE_UNSPECIFIED = 0;
  PARTY_ROLE_CUSTOMER = 1;
  PARTY_ROLE_SUPPLIER = 2;
  PARTY_ROLE_PROSPECT = 3;
}

enum AddressKind {
  ADDRESS_KIND_UNSPECIFIED = 0;
  ADDRESS_KIND_BILLING = 1;
  ADDRESS_KIND_SHIPPING = 2;
  ADDRESS_KIND_OTHER = 3;
}

message Party {
  string id = 1;
  string display_name = 2;
  repeated PartyRole roles = 3;
  uint64 created_at = 4;
  bool active = 5;
}

message Contact {
  string id = 1;
  string party_id = 2;
  string name = 3;
  optional string email = 4;
  optional string phone = 5;
  bool active = 6;
}

message Address {
  string id = 1;
  string party_id = 2;
  AddressKind kind = 3;
  string line1 = 4;
  optional string line2 = 5;
  string city = 6;
  optional string state_region = 7;
  optional string postal_code = 8;
  string country = 9;
  bool active = 10;
}

message CreatePartyRequest {
  string display_name = 1;
  repeated PartyRole roles = 2;
}

message GetPartyRequest {
  string id = 1;
}

message ListPartiesRequest {
  // When set (not UNSPECIFIED), only parties holding this role are returned.
  PartyRole role_filter = 1;
}

message ListPartiesResponse {
  repeated Party parties = 1;
}

message UpdatePartyRequest {
  string id = 1;
  optional string display_name = 2;
  optional bool active = 3;
  bool update_roles = 4;
  repeated PartyRole roles = 5;
}

message AddContactRequest {
  string party_id = 1;
  string name = 2;
  optional string email = 3;
  optional string phone = 4;
}

message ListContactsRequest {
  string party_id = 1;
}

message ListContactsResponse {
  repeated Contact contacts = 1;
}

message AddAddressRequest {
  string party_id = 1;
  AddressKind kind = 2;
  string line1 = 3;
  optional string line2 = 4;
  string city = 5;
  optional string state_region = 6;
  optional string postal_code = 7;
  string country = 8;
}

message ListAddressesRequest {
  string party_id = 1;
}

message ListAddressesResponse {
  repeated Address addresses = 1;
}

message UpdateContactRequest {
  string id = 1;
  optional string name = 2;
  optional string email = 3;
  optional string phone = 4;
  optional bool active = 5;
}

message UpdateAddressRequest {
  string id = 1;
  optional AddressKind kind = 2;
  optional string line1 = 3;
  optional string line2 = 4;
  optional string city = 5;
  optional string state_region = 6;
  optional string postal_code = 7;
  optional string country = 8;
  optional bool active = 9;
}

service PartyService {
  rpc CreateParty(CreatePartyRequest) returns (Party);
  rpc GetParty(GetPartyRequest) returns (Party);
  rpc ListParties(ListPartiesRequest) returns (ListPartiesResponse);
  rpc UpdateParty(UpdatePartyRequest) returns (Party);
  rpc AddContact(AddContactRequest) returns (Contact);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  rpc UpdateContact(UpdateContactRequest) returns (Contact);
  rpc AddAddress(AddAddressRequest) returns (Address);
  rpc ListAddresses(ListAddressesRequest) returns (ListAddressesResponse);
  rpc UpdateAddress(UpdateAddressRequest) returns (Address);
}
