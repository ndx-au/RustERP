//
// Parties domain messages + PartyService.
// Suggested RBAC (not enforced): party:read, party:write.
// Persistence is in-memory in Phase 2; auth is not enforced.

syntax = "proto3";

package rusterp.party.v1;

// Business role a party may hold. A party may hold several roles.
enum PartyRole {
  PARTY_ROLE_UNSPECIFIED = 0;
  PARTY_ROLE_CUSTOMER = 1;
  PARTY_ROLE_SUPPLIER = 2;
  PARTY_ROLE_PROSPECT = 3;
}

// A party aggregate (customer / supplier / prospect combination).
message Party {
  // UUID v4 string.
  string id = 1;
  string display_name = 2;
  repeated PartyRole roles = 3;
  // Unix time in seconds.
  uint64 created_at = 4;
  bool active = 5;
}

// Contact belonging to a party.
message Contact {
  // UUID v4 string.
  string id = 1;
  string party_id = 2;
  string name = 3;
  optional string email = 4;
  optional string phone = 5;
}

message CreatePartyRequest {
  string display_name = 1;
  repeated PartyRole roles = 2;
}

message GetPartyRequest {
  string id = 1;
}

message ListPartiesRequest {}

message ListPartiesResponse {
  repeated Party parties = 1;
}

message UpdatePartyRequest {
  string id = 1;
  optional string display_name = 2;
  optional bool active = 3;
  // When true, replace the party's roles with `roles` (must be non-empty).
  bool update_roles = 4;
  repeated PartyRole roles = 5;
}

message AddContactRequest {
  string party_id = 1;
  string name = 2;
  optional string email = 3;
  optional string phone = 4;
}

message ListContactsRequest {
  string party_id = 1;
}

message ListContactsResponse {
  repeated Contact contacts = 1;
}

// Parties gRPC API. No auth enforced in Phase 2.
service PartyService {
  rpc CreateParty(CreatePartyRequest) returns (Party);
  rpc GetParty(GetPartyRequest) returns (Party);
  rpc ListParties(ListPartiesRequest) returns (ListPartiesResponse);
  rpc UpdateParty(UpdatePartyRequest) returns (Party);
  rpc AddContact(AddContactRequest) returns (Contact);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
}
