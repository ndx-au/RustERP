[package]
name = "rusterp-server"
description = "Thin gRPC server binary for RustERP (Parties + Health, in-memory)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "rusterp-server"
path = "src/main.rs"

[dependencies]
rusterp-parties = { path = "../rusterp-parties" }
rusterp-proto = { path = "../rusterp-proto" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
slozhn = { workspace = true, features = ["server"] }
axum = { workspace = true, features = ["tokio", "http1", "ws"] }
tower-http = { workspace = true, features = ["fs", "trace", "set-header"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
tonic = { workspace = true, features = ["transport", "router", "server"] }
tonic-reflection = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
nix = { version = "0.29", default-features = false, features = ["signal"] }
